name: Daily AI Post

on:
  workflow_dispatch:
  schedule:
    - cron: '0 7 * * *'

jobs:
  post:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install requests

      - run: python main.py
